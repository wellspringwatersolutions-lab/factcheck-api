services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factcheck
      POSTGRES_PASSWORD: factcheck
      POSTGRES_DB: factcheck
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: .
    ports:
      - "8741:8741"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://factcheck:factcheck@postgres:5432/factcheck
      REDIS_URL: redis://redis:6379/0
      CACHE_BACKEND: redis
      PUBLIC_BASE_URL: http://127.0.0.1:8741
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

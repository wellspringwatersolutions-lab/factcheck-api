[project]
name = "factcheck"
version = "0.1.0"
description = "Fact-checking for AI agents and researchers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "redis>=5.2",
  "mcp>=2.3,<3",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
factcheck = "factcheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factcheck = ["eval/fixtures/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
